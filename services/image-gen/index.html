<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recast image-gen test</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif; }
  body { margin: 0; padding: 20px; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { opacity: .7; font-size: 13px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: 380px 1fr; gap: 20px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; opacity: .8; margin: 10px 0 3px; }
  input, select, textarea, button { width: 100%; box-sizing: border-box; font: inherit; padding: 7px 8px; border-radius: 6px; border: 1px solid #8884; background: transparent; color: inherit; }
  textarea { min-height: 110px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  button.go { margin-top: 14px; padding: 10px; font-weight: 600; background: #76b900; color: #000; border: 0; cursor: pointer; }
  button.go:disabled { opacity: .5; cursor: wait; }
  button.link { width: auto; padding: 2px 8px; font-size: 12px; margin-right: 6px; }
  #status { font-size: 12px; margin-top: 10px; white-space: pre-wrap; opacity: .85; }
  #result img { max-width: 100%; border-radius: 8px; border: 1px solid #8884; }
  #meta { font-size: 12px; opacity: .75; margin-top: 6px; }
  #health { font-size: 12px; opacity: .8; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; border: 1px solid #8886; margin-right: 6px; }
  .ok { border-color: #76b900; } .no { border-color: #d44; }
</style>
</head>
<body>
<h1>Recast image-gen test</h1>
<div class="sub">FLUX.1-dev via local NIM on the Spark, or build.nvidia.com fallback. <span id="health">checking…</span></div>

<div class="grid">
  <div>
    <div>
      <button class="link" onclick="preset('base')">preset: concept</button>
      <button class="link" onclick="preset('recast')">preset: Recast prompt</button>
    </div>
    <label>Prompt</label>
    <textarea id="prompt">Photorealistic architectural visualization, Seattle, overcast daylight. Interior of a 1980s office tower floor, currently vacant, re-imagined as mixed-income apartments. Keep the existing structure: columns, floor plate, ceiling height, window walls and views. Realistic materials, a few people, wide angle, 35mm lens, no text, no watermark.</textarea>

    <div class="row">
      <div><label>Mode</label>
        <select id="mode"><option value="base">base (text only)</option><option value="depth">depth (keep layout)</option><option value="canny">canny (keep edges)</option></select></div>
      <div><label>Backend</label>
        <select id="backend"><option value="auto">auto</option><option value="nim">nim (Spark)</option><option value="hosted">hosted</option></select></div>
    </div>
    <label>Reference photo (depth/canny only)</label>
    <input id="image" type="file" accept="image/*">
    <div class="row3">
      <div><label>Width</label><input id="width" type="number" value="1024" step="64" min="768" max="1344"></div>
      <div><label>Height</label><input id="height" type="number" value="1024" step="64" min="768" max="1344"></div>
      <div><label>Steps</label><input id="steps" type="number" value="30" min="5" max="100"></div>
    </div>
    <div class="row">
      <div><label>CFG scale (blank = default)</label><input id="cfg" type="number" step="0.5" min="1" max="9" placeholder="3.5 base / 7 depth,canny"></div>
      <div><label>Seed</label><input id="seed" type="number" value="0"></div>
    </div>
    <button class="go" id="go" onclick="go()">Generate</button>
    <div id="status"></div>
  </div>
  <div>
    <div id="result"></div>
    <div id="meta"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

fetch('/health').then(r => r.json()).then(h => {
  $('health').innerHTML =
    `<span class="pill ${h.nim.ready ? 'ok' : 'no'}">NIM ${h.nim.ready ? 'ready' : 'not running'} @ ${h.nim.url}</span>` +
    `<span class="pill ${h.hosted.configured ? 'ok' : 'no'}">hosted ${h.hosted.configured ? 'configured' : 'no NVIDIA_API_KEY'}</span>`;
}).catch(() => $('health').textContent = 'health check failed');

function preset(kind) {
  if (kind === 'base') {
    $('prompt').value = 'A bright, welcoming co-working lobby inside a converted 1980s Seattle office tower, warm wood, plants, people working, photorealistic, wide angle, no text.';
    $('mode').value = 'base';
  } else {
    $('prompt').value = 'Photorealistic architectural visualization, Seattle, overcast daylight. Interior of the Lake Union Building, currently a vacant office floor, re-imagined as a community health clinic. Keep the existing structure: columns, floor plate, ceiling height, window walls and views. Adaptive reuse, not new construction. Realistic materials, a few people using the space, wide angle, eye level, 35mm lens, no text, no watermark.';
  }
}

function fileToDataUrl(file) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); });
}

async function go() {
  const body = {
    prompt: $('prompt').value, mode: $('mode').value, backend: $('backend').value,
    width: +$('width').value, height: +$('height').value, steps: +$('steps').value,
    seed: +$('seed').value,
  };
  if ($('cfg').value) body.cfg_scale = +$('cfg').value;
  const f = $('image').files[0];
  if (f) body.image = await fileToDataUrl(f);
  else if (body.mode !== 'base') { $('status').textContent = 'depth/canny need a reference photo'; return; }

  $('go').disabled = true;
  const t0 = performance.now();
  $('status').textContent = 'generating… (Spark NIM: ~30–120 s; hosted: ~10–30 s)';
  try {
    const r = await fetch('/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || r.status);
    $('result').innerHTML = `<img alt="generated" src="data:${j.mime};base64,${j.image_b64}">`;
    $('meta').textContent = `${j.backend} · ${j.mode} · ${j.width}x${j.height} · ${j.steps} steps · cfg ${j.cfg_scale} · seed ${j.seed} · ${j.elapsed_s}s model time` + (j.file ? ` · saved ${j.file}` : '');
    $('status').textContent = `done in ${((performance.now() - t0) / 1000).toFixed(1)}s`;
  } catch (e) {
    $('status').textContent = 'error: ' + e.message;
  } finally {
    $('go').disabled = false;
  }
}
</script>
</body>
</html>
